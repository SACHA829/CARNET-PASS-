    if (avgPts.length > 1) s += '<polyline points="' + avgPts.map(p => p[0] + ',' + p[1]).join(' ') + '" fill="none" stroke="var(--ink)" stroke-width="2" stroke-dasharray="6 4" opacity=".6"/>';
    avgPts.forEach(p => s += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="4" fill="var(--ink)"><title>' + h('Moyenne générale · ' + fmtDateShort(p[2].date) + ' · ' + examAverage(p[2]).toFixed(1) + '/20') + '</title></circle>');
    s += '</svg>';
    return s;
  }
  function examRankChart() {
    const exams = sortedExams().filter(ex => examPercentile(ex) !== null);
    const width = 680, height = 170, padL = 34, padR = 16, padT = 16, padB = 36;

    s += '</svg>';
    return s;
  }

      html += '<div class="card chart-card"><h3>Notes par matière</h3><div class="sub">Une couleur par matière (notes /20). Pointillés noirs : moyenne générale du concours.</div>' + examNotesChart();
      html += '<div class="chart-legend">'; subjectsWithExamData().forEach(s => html += '<span>' + subjectDot(s) + ' ' + h(s.name) + '</span>'); html += '<span><span style="display:inline-block; width:16px; height:0; border-top:2px dashed var(--ink); opacity:.6; vertical-align:3px; margin-right:4px;"></span>moyenne générale</span></div></div>';

  function svgText(x, y, t, opts) {
    opts = opts || {};
    return '<text x="' + x + '" y="' + y + '" font-size="' + (opts.size || 11) + '" fill="' + (opts.fill || 'var(--ink-soft)') + '" text-anchor="' + (opts.anchor || 'start') + '"' + (opts.weight ? ' font-weight="' + opts.weight + '"' : '') + '>' + h(t) + '</text>';
  }
  // Régression linéaire simple : renvoie {slope, intercept} pour des points [x,y].
  function linreg(xs, ys) {
    const n = xs.length; if (n < 2) return { slope: 0, intercept: ys[0] || 0 };
    const mx = xs.reduce((a, b) => a + b, 0) / n, my = ys.reduce((a, b) => a + b, 0) / n;
    const den = xs.reduce((a, v) => a + (v - mx) * (v - mx), 0);
    const slope = den ? xs.reduce((a, v, i) => a + (v - mx) * (ys[i] - my), 0) / den : 0;
    return { slope, intercept: my - slope * mx };
  }
  function trendBadge(perWeek) {
    const cls = perWeek < 0 ? ' neg' : '';
    const sign = perWeek > 0 ? '+' : '';
    return '<span class="trend-badge' + cls + '">' + sign + perWeek.toFixed(1) + ' cours/sem.</span>';
  }
  // Barres empilées par matière, une métrique par semaine, avec courbe de tendance (régression linéaire).
  function weeklyBarChart(A, opts) {
    const W = A.weeks, n = W.length;
    const width = 680, height = 230, padL = 30, padR = 14, padT = 16, padB = 34;
    const iw = width - padL - padR, ih = height - padT - padB;
    const values = W.map(opts.value);
    const maxV = Math.max(4, Math.ceil(Math.max(...values, 1) / 2) * 2);
    const step = iw / n, bw = Math.min(30, step * 0.55);
    const y = v => padT + ih - v / maxV * ih;
    const x = i => padL + step * i + step / 2;
    let s = '<svg viewBox="0 0 ' + width + ' ' + height + '" role="img" aria-label="' + h(opts.label) + '">';
    for (let i = 0; i <= 4; i++) { const v = Math.round(maxV / 4 * i); s += '<line x1="' + padL + '" x2="' + (width - padR) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="var(--line-soft)"/>' + svgText(padL - 7, y(v) + 4, v, { anchor: 'end' }); }
    W.forEach((w, i) => {
      const cx = x(i);
      if (opts.stacked) {
        let acc = 0;
        Object.keys(w.bySubject).forEach(sid => {
          const sub = state.subjects.find(s => s.id === sid); const v = w.bySubject[sid]; if (!v) return;
          s += '<rect x="' + (cx - bw / 2) + '" y="' + y(acc + v) + '" width="' + bw + '" height="' + Math.max(0, y(acc) - y(acc + v)) + '" fill="' + (sub ? sub.color : 'var(--ink-faint)') + '"><title>' + h((sub ? sub.name : '?') + ' · ' + v + ' cours (sem. du ' + fmtDateShort(w.start) + ')') + '</title></rect>';
          acc += v;
        });
        if (!Object.keys(w.bySubject).length) s += '<rect x="' + (cx - bw / 2) + '" y="' + y(0) + '" width="' + bw + '" height="0"/>';
      } else {
        const v = opts.value(w);
        if (v) s += '<rect x="' + (cx - bw / 2) + '" y="' + y(v) + '" width="' + bw + '" height="' + Math.max(0, y(0) - y(v)) + '" rx="4" fill="var(--tertiary)"><title>' + h(v + ' révisions faites (sem. du ' + fmtDateShort(w.start) + ')') + '</title></rect>';
      }
      s += svgText(cx, height - padB + 16, fmtDateShort(w.start), { anchor: 'middle', size: 10 });
      if (i === n - 1) s += svgText(cx, height - padB + 28, 'cette sem.', { anchor: 'middle', size: 9.5, fill: 'var(--primary)', weight: 700 });
    });
    // tendance
    const xs = W.map((w, i) => i), ys = values;
    const { slope, intercept } = linreg(xs, ys);
    const ty0 = Math.max(0, Math.min(maxV, intercept));
    const ty1 = Math.max(0, Math.min(maxV, intercept + slope * (n - 1)));
    s += '<line x1="' + x(0) + '" y1="' + y(ty0) + '" x2="' + x(n - 1) + '" y2="' + y(ty1) + '" stroke="var(--ink)" stroke-width="2" stroke-dasharray="6 4" opacity=".55"><title>Tendance : ' + (slope >= 0 ? '+' : '') + slope.toFixed(2) + ' par semaine</title></line>';
    s += '</svg>';
    return { svg: s, slope };
  }
  function cumulativeChart(A) {
    const P = A.pts;
    const width = 680, height = 230, padL = 30, padR = 16, padT = 18, padB = 32;
    const iw = width - padL - padR, ih = height - padT - padB;
    if (!P.length) return '';
    const d0 = mondayOf(A.firstDate), d1 = state.dateStr;
    const span = Math.max(7, daysBetween(d0, d1));
    const maxN = Math.ceil(Math.max(4, P.length) / 4) * 4;
    const x = d => padL + daysBetween(d0, d) / span * iw;
    const y = n => padT + ih - n / maxN * ih;
    let s = '<svg viewBox="0 0 ' + width + ' ' + height + '" role="img" aria-label="Cours appris cumulés">';
    for (let i = 0; i <= 4; i++) { const v = Math.round(maxN / 4 * i); s += '<line x1="' + padL + '" x2="' + (width - padR) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="var(--line-soft)"/>' + svgText(padL - 7, y(v) + 4, v, { anchor: 'end' }); }
    const ticks = Math.min(6, Math.ceil(span / 10));
    for (let i = 0; i <= ticks; i++) { const d = addDays(d0, Math.round(span * i / ticks)); s += svgText(x(d), height - padB + 16, fmtDateShort(d), { anchor: 'middle', size: 10 }); }
    if (P.length >= 2) {
      const xs = P.map(p => daysBetween(d0, p.date)), ys = P.map(p => p.n);
      const { slope, intercept } = linreg(xs, ys);
      s += '<line x1="' + x(d0) + '" y1="' + y(Math.max(0, intercept)) + '" x2="' + x(d1) + '" y2="' + y(Math.min(maxN, intercept + slope * span)) + '" stroke="var(--ink-faint)" stroke-width="1.5" stroke-dasharray="5 4"><title>Rythme moyen : ' + (slope * 7).toFixed(1) + ' cours / semaine</title></line>';
    }
    s += '<polyline points="' + P.map(p => x(p.date) + ',' + y(p.n)).join(' ') + '" fill="none" stroke="var(--ink)" stroke-width="1.5" opacity=".3"/>';
    P.forEach(p => s += '<circle cx="' + x(p.date) + '" cy="' + y(p.n) + '" r="5" fill="' + h(p.subject.color) + '" stroke="var(--surface)" stroke-width="1.5"><title>' + h(p.chapter.name + ' (' + p.subject.name + ') · ' + fmtDateShort(p.date) + ' · ' + p.n + 'e cours') + '</title></circle>');
    const last = P[P.length - 1];
    const lx = Math.min(width - padR - 76, x(last.date) - 36), ly = Math.max(padT, y(last.n) - 26);
    s += '<rect x="' + lx + '" y="' + ly + '" width="72" height="20" rx="10" fill="var(--ink)"/>' + svgText(lx + 36, ly + 14, 'Total : ' + last.n, { anchor: 'middle', fill: 'var(--paper)', weight: 700 });
    s += '</svg>';
    return s;
  }

    html += '</div><div>';
    html += '<h2>À surveiller</h2><p class="small muted" style="margin:-6px 0 12px;">Déduit automatiquement des ressentis, des retards et du rythme.</p>';

  function folderDescendants(id) { const out = [id]; state.lib.folders.filter(f => f.parentId === id).forEach(f => out.push(...folderDescendants(f.id))); return out; }
  function countIn(folderId) { const ids = folderDescendants(folderId); return state.lib.files.filter(f => ids.includes(f.folderId)).length; }

        html += '<select data-file-move="' + f.id + '"><option value="">déplacer vers…</option><option value="root">Bibliothèque</option>'; L.folders.forEach(fo => html += '<option value="' + fo.id + '" ' + (fo.id === f.folderId ? 'disabled' : '') + '>' + h(folderPath(fo.id).map(x => x.name).join(' / ')) + '</option>'); html += '</select>';

  /* ---- papers ---- */
  function expiryState(p) {
    if (!p.expiry) return null;
    const d = daysBetween(state.dateStr, p.expiry);
    if (d < 0) return { cls: 'expired', text: 'expiré depuis ' + (-d) + ' j' };
    if (d <= 60) return { cls: 'soon', text: 'expire dans ' + d + ' j' };
    return { cls: '', text: 'valable jusqu\'au ' + fmtDateShort(p.expiry) };
  }
  function renderPapers() {
    const P = state.papers;

    if (warn.length) {
      html += '<div class="alert yellow" style="margin-bottom:14px;"><span class="ico"></span><div><div class="t">' + warn.length + ' papier' + (warn.length > 1 ? 's' : '') + ' à renouveler bientôt</div><div class="d">' + warn.map(p => h(p.name) + ' (' + expiryState(p).text + ')').join(' · ') + '</div></div></div>';

    PAPER_CATS.forEach(c => { const n = P.files.filter(p => p.category === c).length; if (n || P.cat === c) html += '<button class="chip ' + (P.cat === c ? 'active' : '') + '" data-paper-cat="' + c + '">' + c + ' (' + n + ')</button>'; });
    html += '</div>';

  /* ---- protection des données ---- */

        html += '<button class="btn primary sm" data-sync-setup-open="1">Configurer la synchronisation</button>';
      } else {
        html += '<p class="small muted">Colle ci-dessous le bloc de configuration copié depuis la console Firebase (Paramètres du projet → Général → Tes applications → SDK).</p>';
        html += '<textarea id="sync-config-paste" rows="6" placeholder="const firebaseConfig = { apiKey: ... };" style="width:100%; font-family:monospace; font-size:11.5px;"></textarea>';
        html += '<div id="sync-config-error" class="error" style="display:none;"></div>';
        html += '<div style="display:flex; gap:8px; margin-top:8px;"><button class="btn teal sm" data-sync-config-save="1">Enregistrer la configuration</button><button class="btn ghost sm" data-sync-setup-cancel="1">Annuler</button></div>';
      }
      return html + '</div>';
    }

    if (state.syncUser) {
      const statusMap = { synced: ['ok', 'À jour'], syncing: ['warn', 'Synchronisation en cours…'], error: ['warn', 'Erreur de synchronisation'], conflict: ['warn', 'Décision en attente (voir en haut de page)'] };
      const st = statusMap[state.syncStatus] || ['off', 'Statut inconnu'];
      html += '<div class="safety-status"><span class="dot ' + st[0] + '"></span>' + h(state.syncUser) + ' · ' + st[1] + '</div>';
      if (state.syncStatus === 'error' && state.syncError) html += '<div class="error" style="margin-bottom:8px;">' + h(state.syncError) + '</div>';
      html += '<div style="display:flex; gap:8px; flex-wrap:wrap;"><button class="btn ghost sm" data-sync-now="1">Synchroniser maintenant</button><button class="link" data-sync-signout="1">se déconnecter</button><button class="link" data-sync-forget="1" style="color:var(--primary);">désactiver sur cet appareil</button></div>';
    } else {
      html += '<div class="safety-status"><span class="dot warn"></span>Configuré, mais pas connecté sur cet appareil.</div>';
      html += '<div class="seg" style="margin-bottom:10px;"><button class="' + (state.syncAuthMode === 'signup' ? 'active' : '') + '" data-sync-mode="signup">Créer un compte</button><button class="' + (state.syncAuthMode === 'signin' ? 'active' : '') + '" data-sync-mode="signin">Se connecter</button></div>';

      if (state.syncAuthMode === 'signup') html += '<div class="field"><label>Confirmer</label><input type="password" id="sync-pass2" autocomplete="new-password" style="flex:1;"></div>';
      html += '<div id="sync-auth-error" class="error" style="display:none;"></div>';
      html += '<div style="display:flex; gap:8px; align-items:center;"><button class="btn teal sm" data-sync-submit="1" ' + (state.syncPending ? 'disabled' : '') + '>' + (state.syncAuthMode === 'signup' ? 'Créer le compte' : 'Se connecter') + '</button><button class="link" data-sync-forget="1" style="color:var(--primary);">changer de configuration</button></div>';
    }

      html += '<div class="safety-status"><span class="dot off"></span>Non disponible dans ce navigateur (fonctionne sur Chrome et Edge). Utilise l\'export manuel ci-dessous en attendant.</div>';

    html += '<div style="display:flex; gap:8px; flex-wrap:wrap;"><button class="btn ghost sm" data-export="1">Exporter (JSON)</button><label class="btn ghost sm" style="display:inline-block;">Importer<input type="file" id="import-file" accept="application/json" style="display:none;"></label></div>';
    html += '<div class="small faint" style="margin-top:12px;">' + everyChapter().length + ' cours · ' + state.subjects.length + ' matières · ' + Object.keys(localStorage).filter(k => k.startsWith(CALENDAR_PREFIX)).length + ' journées planifiées · ' + state.lib.files.length + ' PDF · ' + state.papers.files.length + ' papiers</div>';

    else {

      html += '<input type="text" id="reset-confirm-input" placeholder="EFFACER" autocomplete="off">';
      html += '<div style="margin-top:10px; display:flex; gap:8px;"><button class="btn danger sm" id="reset-confirm-btn" disabled>Tout effacer définitivement</button><button class="btn ghost sm" data-reset-cancel="1">Annuler</button></div></div>';
    }

  /* ---------- events ---------- */
  function on(selector, event, fn) { root.querySelectorAll(selector).forEach(el => el.addEventListener(event, e => fn(el, e))); }
  function parseOffsets(str) {
    const arr = str.split(/[,;\s]+/).map(s => parseInt(s, 10)).filter(n => !isNaN(n) && n >= 0);
    return Array.from(new Set(arr)).sort((a, b) => a - b);
  }
  function closeTransient() { state.editingRev = null; state.editingBlock = null; state.paletteFor = null; state.askRessenti = null; state.renaming = null; state.resetConfirmOpen = false; state.examNewForm = false; state.examAddEntry = null; state.examEditEntry = null; state.examRenaming = null; }

  function attachEvents() {
    on('[data-tab]', 'click', el => {
      state.activeTab = el.getAttribute('data-tab'); closeTransient(); render();
      if (state.activeTab === 'settings') { listBackups().then(list => { state.backups = list; render(); }); fsCheckStatus().then(st => { state.fsStatus = st; render(); }); }
    });
    on('[data-sem]', 'click', el => { state.settings.activeSemester = el.getAttribute('data-sem'); saveSettings(); closeTransient(); render(); });

    /* today: tasks */
    const taskInput = root.querySelector('#new-task-input');
    if (taskInput) {
      const doAdd = () => {
        const v = taskInput.value.trim(); if (!v) return;
        const d = (root.querySelector('#new-task-date').value) || state.dateStr; state.taskDate = d;
        if (d === state.dateStr) { state.checklist.push({ id: uid(), text: v, done: false }); saveChecklist(); }
        else { const l = loadChecklist(d); l.push({ id: uid(), text: v, done: false }); saveChecklistFor(d, l); toast('Prévu le ' + fmtDateShort(d)); }
        render();
      };
      root.querySelector('#add-task-btn').addEventListener('click', doAdd);
      taskInput.addEventListener('keydown', e => { if (e.key === 'Enter') doAdd(); });
    }
    const taskRef = attr => { const [date, id] = attr.split(':'); const list = date === state.dateStr ? state.checklist : loadChecklist(date); return { date, id, list, item: list.find(t => t.id === id) }; };
    const commitTasks = (date, list) => { if (date === state.dateStr) { state.checklist = list; saveChecklist(); } else saveChecklistFor(date, list); };
    const moveTask = (attr, to) => {
      const r = taskRef(attr); if (!r.item || !to || to === r.date) return;
      commitTasks(r.date, r.list.filter(t => t !== r.item));
      const dest = to === state.dateStr ? state.checklist : loadChecklist(to); dest.push(r.item); commitTasks(to, dest);
      render(); toast('Déplacé au ' + fmtDateShort(to));
    };

        if (eb.id) saveBlocks(eb.date, loadBlocks(eb.date).filter(b => b.id !== eb.id));
        if (f.freq === 'none') { const blocks = loadBlocks(f.date); blocks.push(Object.assign({ id: eb.id || uid() }, base)); saveBlocks(f.date, blocks); toast(eb.id ? 'Créneau modifié' : 'Créneau ajouté'); }
        else { rules.push(Object.assign({ id: uid(), from: f.date, freq: f.freq, days: f.days, until: f.until, skip: [] }, base)); saveRecurring(rules); toast('Créneau répété ' + repeatLabel({ freq: f.freq, days: f.days })); }
      }
      state.weekStart = mondayOf(f.date); state.editingBlock = null; render();
    });
    on('[data-block-skip]', 'click', () => { const eb = state.editingBlock; if (!eb || !eb.recId) return; const rules = loadRecurring(); const r = rules.find(x => x.id === eb.recId); if (r) { r.skip = (r.skip || []).concat([eb.date]); saveRecurring(rules); } state.editingBlock = null; render(); toast('Retiré pour le ' + fmtDateShort(eb.date)); });
    on('[data-block-delete]', 'click', () => {
      const eb = state.editingBlock; if (!eb) return;
      if (eb.recId) { if (!confirm('Supprimer toute la série ?')) return; saveRecurring(loadRecurring().filter(r => r.id !== eb.recId)); }
      else if (eb.id) saveBlocks(eb.date, loadBlocks(eb.date).filter(b => b.id !== eb.id));
      state.editingBlock = null; render();
    });
    on('[data-block-dup]', 'click', () => {
      const eb = state.editingBlock; if (!eb || !eb.id) return;
      const b = loadBlocks(eb.date).find(x => x.id === eb.id); if (!b) return;
      const next = addDays(eb.date, 1); const blocks = loadBlocks(next); blocks.push(Object.assign({}, b, { id: uid() })); saveBlocks(next, blocks);
      render(); toast('Copié au ' + fmtDateShort(next));
    });
    on('[data-rec-del]', 'click', el => { saveRecurring(loadRecurring().filter(r => r.id !== el.getAttribute('data-rec-del'))); render(); toast('Série supprimée'); });

    /* settings */
    on('[data-theme-pick]', 'click', el => { state.settings.theme = el.getAttribute('data-theme-pick'); saveSettings(); render(); });
    on('[data-sem-save]', 'click', () => { state.settings.semesters.forEach(s => { const i = root.querySelector('[data-sem-name="' + s.id + '"]'); if (i && i.value.trim()) s.name = i.value.trim(); }); saveSettings(); render(); toast('Semestres enregistrés'); });
    on('[data-sem-add]', 'click', () => { const n = state.settings.semesters.length + 1; state.settings.semesters.push({ id: 's' + Date.now().toString(36), name: 'Semestre ' + n }); saveSettings(); render(); });
    on('[data-sem-del]', 'click', el => {
      const id = el.getAttribute('data-sem-del'); const S = state.settings; if (S.semesters.length <= 1) return;
      const fallback = S.semesters.find(s => s.id !== id).id;
      const n = state.subjects.filter(s => s.semesterId === id).length;
      if (n && !confirm('Retirer ce semestre ? Ses ' + n + ' matières passeront dans « ' + semesterName(fallback) + ' ».')) return;
      state.subjects.forEach(s => { if (s.semesterId === id) s.semesterId = fallback; }); saveSubjects();
      S.semesters = S.semesters.filter(s => s.id !== id); if (S.activeSemester === id) S.activeSemester = 'all'; saveSettings(); render();
    });
    on('[data-save-profiles]', 'click', () => {
      let ok = true;
      ['difficile', 'moyen', 'facile'].forEach(k => { const arr = parseOffsets(root.querySelector('[data-profile="' + k + '"]').value); if (!arr.length) ok = false; else state.settings.profiles[k] = arr; });
      if (!ok) { toast('Chaque rythme doit contenir au moins un nombre'); return; }
      saveSettings(); render(); toast('Rythmes enregistrés');
    });
    on('[data-apply-profiles]', 'click', () => {
      if (!confirm('Recalculer les J non faits de tous les cours selon leur ressenti ?')) return;
      everyChapter().filter(x => x.chapter.status !== 'todo').forEach(({ chapter }) => rebuildReviews(chapter, offsetsFor(chapter.ressenti)));
      saveSubjects(); render(); toast('Rappels recalculés');
    });
    on('[data-setting-check]', 'change', el => { state.settings[el.getAttribute('data-setting-check')] = el.checked; saveSettings(); });
    on('[data-setting-num]', 'change', el => {
      const k = el.getAttribute('data-setting-num'); const v = parseInt(el.value, 10); if (isNaN(v)) return;
      state.settings[k] = v;
      if (state.settings.dayEnd <= state.settings.dayStart) state.settings.dayEnd = Math.min(24, state.settings.dayStart + 1);
      saveSettings(); render();
    });
    on('[data-export]', 'click', () => { downloadData(fullExportData(), 'carnet-pass-' + todayStr() + '.json'); toast('Export téléchargé'); });
    const imp = root.querySelector('#import-file');
    if (imp) imp.addEventListener('change', () => {
      const f = imp.files[0]; if (!f) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          if (!Array.isArray(data.subjects)) throw new Error('format');
          if (!confirm('Remplacer les données actuelles par cette sauvegarde ? Une sauvegarde de sécurité de l\'état actuel sera prise avant.')) return;
          snapshotNow('avant import').then(() => {
            applyImportedData(data); render(); toast('Sauvegarde importée');
          });
        } catch (e) { toast('Fichier illisible : export JSON du carnet attendu'); }
      };
      reader.readAsText(f);
    });

    /* protection des données */
    const refreshBackups = () => listBackups().then(list => { state.backups = list; render(); });
    on('[data-snapshot-now]', 'click', () => { snapshotNow('manuelle').then(() => { toast('Sauvegarde créée'); refreshBackups(); }); });
    on('[data-backup-restore]', 'click', el => {
      if (!confirm('Restaurer cette sauvegarde ? Elle remplacera les données actuelles (une sauvegarde de l\'état actuel sera prise avant, par sécurité).')) return;
      snapshotNow('avant restauration').then(() => restoreBackupById(el.getAttribute('data-backup-restore'))).then(ok => { render(); toast(ok ? 'Sauvegarde restaurée' : 'Sauvegarde introuvable'); refreshBackups(); });
    });
    on('[data-trash-restore]', 'click', el => { restoreTrashItem(el.getAttribute('data-trash-restore')); render(); toast('Restauré'); });
    on('[data-trash-purge]', 'click', el => { if (!confirm('Supprimer définitivement cet élément de la corbeille ?')) return; purgeTrashItem(el.getAttribute('data-trash-purge')); render(); });
    on('[data-cat-color]', 'input', el => { const S = state.settings; S.categoryColors = S.categoryColors || {}; S.categoryColors[el.getAttribute('data-cat-color')] = el.value; saveSettings(); });
    on('[data-cat-color]', 'change', () => render());
    on('[data-cat-color-reset]', 'click', el => { const S = state.settings; if (S.categoryColors) delete S.categoryColors[el.getAttribute('data-cat-color-reset')]; saveSettings(); render(); });

    on('[data-fs-connect]', 'click', () => { fsConnect().then(() => { render(); toast('Sauvegarde sur disque activée'); }).catch(() => {}); });
    on('[data-fs-reconnect]', 'click', () => { fsReconnect().then(() => render()); });
    on('[data-fs-disconnect]', 'click', () => { if (!confirm('Désactiver la sauvegarde automatique sur le disque ?')) return; fsDisconnect().then(() => render()); });

    on('[data-reset-open]', 'click', () => { state.resetConfirmOpen = true; render(); const i = root.querySelector('#reset-confirm-input'); if (i) i.focus(); });
    on('[data-reset-cancel]', 'click', () => { state.resetConfirmOpen = false; render(); });
    const rci = root.querySelector('#reset-confirm-input');
    if (rci) rci.addEventListener('input', () => { const btn = root.querySelector('#reset-confirm-btn'); if (btn) btn.disabled = rci.value.trim() !== 'EFFACER'; });
    const rcb = root.querySelector('#reset-confirm-btn');
    if (rcb) rcb.addEventListener('click', () => {
      downloadData(fullExportData(), 'carnet-pass-avant-effacement-' + todayStr() + '.json');
      Object.keys(localStorage).filter(k => k.startsWith('carnet_pass_')).forEach(k => localStorage.removeItem(k));
      Promise.all([dbReq('meta', 'readwrite', st => st.clear()), dbReq('blobs', 'readwrite', st => st.clear()), dbReq('backups', 'readwrite', st => st.clear())]).catch(() => {}).then(() => { init(); toast('Carnet réinitialisé'); });
    });

    /* synchronisation cloud */
    on('[data-sync-setup-open]', 'click', () => { state.syncFormOpen = true; render(); });
    on('[data-sync-setup-cancel]', 'click', () => { state.syncFormOpen = false; render(); });
    on('[data-sync-config-save]', 'click', () => {
      const err = root.querySelector('#sync-config-error');
      const cfg = parseFirebaseConfigBlock(root.querySelector('#sync-config-paste').value);
      if (!cfg) { err.textContent = 'Configuration illisible. Colle le bloc complet copié depuis Firebase (avec apiKey, authDomain, projectId…).'; err.style.display = 'block'; return; }
      state.syncConfig = cfg; saveSyncConfigData(cfg); state.syncFormOpen = false; state.syncStatus = 'signed-out';
      initFirebase(cfg).then(() => {
        fbAuth.onAuthStateChanged(user => onSyncAuthChange(user));
      }).catch(err2 => { state.syncStatus = 'error'; state.syncError = fbErrorMessage(err2); render(); });
      render(); toast('Configuration enregistrée');
    });
    on('[data-sync-mode]', 'click', el => { state.syncAuthMode = el.getAttribute('data-sync-mode'); render(); });
    on('[data-sync-submit]', 'click', () => {
      const err = root.querySelector('#sync-auth-error'); err.style.display = 'none';
      const email = root.querySelector('#sync-email').value.trim();
      const pass = root.querySelector('#sync-pass').value;
      if (!email || !pass) { err.textContent = 'Renseigne l\'e-mail et le mot de passe.'; err.style.display = 'block'; return; }
      if (state.syncAuthMode === 'signup') {
        const pass2 = root.querySelector('#sync-pass2').value;
        if (pass !== pass2) { err.textContent = 'Les deux mots de passe ne correspondent pas.'; err.style.display = 'block'; return; }
      }
      state.syncPending = true; render();
      const action = state.syncAuthMode === 'signup' ? syncSignUp(email, pass) : syncSignIn(email, pass);
      action.then(cred => { state.syncPending = false; onSyncAuthChange(cred.user); })
        .catch(e => { state.syncPending = false; state.syncError = fbErrorMessage(e); render(); const e2 = root.querySelector('#sync-auth-error'); if (e2) { e2.textContent = fbErrorMessage(e); e2.style.display = 'block'; } });
    });
    on('[data-sync-signout]', 'click', () => { syncSignOut().then(() => { state.syncUser = null; state.syncStatus = 'signed-out'; render(); toast('Déconnecté'); }); });
    on('[data-sync-forget]', 'click', () => {
      if (!confirm('Désactiver la synchronisation sur cet appareil ? Tes données restent intactes ici et dans le cloud — tu pourras te reconnecter plus tard.')) return;
      if (fbAuth) fbAuth.signOut().catch(() => {});
      clearSyncConfigData(); state.syncConfig = null; state.syncUser = null; state.syncStatus = 'unconfigured'; state.syncFormOpen = false; render();
    });
    on('[data-sync-now]', 'click', () => { state.syncStatus = 'syncing'; render(); cloudPush().then(() => { render(); toast('Synchronisé'); }).catch(e => { state.syncStatus = 'error'; state.syncError = fbErrorMessage(e); render(); }); });
    on('[data-sync-load]', 'click', () => { resolveConflictLoad().then(() => { render(); toast('Données du cloud chargées'); }); });
    on('[data-sync-keep]', 'click', () => { resolveConflictKeep().then(() => { render(); toast('Tes données locales ont été gardées et envoyées au cloud'); }); });
    const icsInput = root.querySelector('#ics-file');
    if (icsInput) icsInput.addEventListener('change', () => {
      const f = icsInput.files[0]; if (!f) return;
      const reader = new FileReader();
      reader.onload = () => {
        const res = parseIcs(String(reader.result));
        if (!res.count) { toast('Aucun cours trouvé dans ce fichier'); return; }
        saveJSON(ICS_KEY, { name: f.name, importedAt: todayStr(), events: res.events });
        render(); toast(res.count + ' cours importés');
      };
      reader.readAsText(f);
    });
    on('[data-ics-clear]', 'click', () => { localStorage.removeItem(ICS_KEY); render(); toast('Emploi du temps de la fac retiré'); });

    /* library */
    const L = state.lib;
    const refreshLib = () => reloadFiles().then(render);
    const importFiles = (fileList, folderId) => {
      const pdfs = Array.from(fileList).filter(f => /pdf$/i.test(f.name) || f.type === 'application/pdf');
      if (!pdfs.length) { toast('Seuls les PDF sont acceptés'); return; }
      Promise.all(pdfs.map(f => addPdf(f, folderId))).then(() => { refreshLib(); toast(pdfs.length + ' PDF importé' + (pdfs.length > 1 ? 's' : '')); }).catch(() => toast('Import impossible : stockage plein ou navigateur restreint'));
    };
    const libImport = root.querySelector('#lib-import');
    if (libImport) libImport.addEventListener('change', () => importFiles(libImport.files, L.folderId));
    const bindSearch = (id, obj) => { const el = root.querySelector(id); if (el) el.addEventListener('input', () => { obj.search = el.value; const pos = el.selectionStart; render(); const s2 = root.querySelector(id); if (s2) { s2.focus(); s2.setSelectionRange(pos, pos); } }); };
    bindSearch('#lib-search', L);
    on('[data-open-folder]', 'click', (el, e) => { if (e.target.closest('select, button.link, input')) return; const id = el.getAttribute('data-open-folder'); L.folderId = id === 'root' ? null : id; L.search = ''; L.newFolder = false; L.renameFolder = null; L.renameFile = null; render(); });
    on('[data-lib-new-folder]', 'click', () => { L.newFolder = true; render(); const i = root.querySelector('#lib-folder-name'); if (i) i.focus(); });
    on('[data-lib-cancel-folder]', 'click', () => { L.newFolder = false; render(); });
    on('[data-folder-color]', 'click', el => { root.querySelectorAll('[data-folder-color]').forEach(x => x.classList.remove('selected')); el.classList.add('selected'); });
    const createFolder = () => {
      const name = root.querySelector('#lib-folder-name').value.trim(); if (!name) return;
      const sel = root.querySelector('[data-folder-color].selected'); const color = sel ? sel.getAttribute('data-folder-color') : PALETTE[3];
      L.folders.push({ id: uid(), name, parentId: L.folderId, color }); saveFolders(); L.newFolder = false; render();
    };
    on('[data-lib-create-folder]', 'click', createFolder);
    const fn = root.querySelector('#lib-folder-name'); if (fn) fn.addEventListener('keydown', e => { if (e.key === 'Enter') createFolder(); if (e.key === 'Escape') { L.newFolder = false; render(); } });
    on('[data-lib-rename-folder]', 'click', el => { L.renameFolder = el.getAttribute('data-lib-rename-folder'); render(); const i = root.querySelector('#lib-folder-rename'); if (i) { i.focus(); i.select(); } });
    const renameFolderOk = () => { const i = root.querySelector('#lib-folder-rename'); const f = L.folders.find(x => x.id === L.renameFolder); if (i && f && i.value.trim()) f.name = i.value.trim(); saveFolders(); L.renameFolder = null; render(); };
    on('[data-lib-rename-folder-ok]', 'click', renameFolderOk);
    const fr = root.querySelector('#lib-folder-rename'); if (fr) fr.addEventListener('keydown', e => { if (e.key === 'Enter') renameFolderOk(); });
    on('[data-move-folder]', 'change', el => { const f = L.folders.find(x => x.id === el.getAttribute('data-move-folder')); if (!f || !el.value) return; f.parentId = el.value === 'root' ? null : el.value; saveFolders(); render(); toast('Dossier déplacé'); });
    on('[data-lib-del-folder]', 'click', el => {
      const id = el.getAttribute('data-lib-del-folder'); const f = L.folders.find(x => x.id === id); if (!f) return;
      const n = countIn(id);
      if (!confirm('Supprimer le dossier « ' + f.name + ' » ?' + (n ? ' Ses ' + n + ' cours seront remis à la racine.' : ''))) return;
      const ids = folderDescendants(id);
      Promise.all(L.files.filter(x => ids.includes(x.folderId)).map(x => updateMeta(Object.assign(x, { folderId: null })))).then(() => {
        L.folders = L.folders.filter(x => !ids.includes(x.id)); saveFolders(); L.folderId = f.parentId; refreshLib();
      });
    });
    on('[data-lib-open]', 'click', el => openFile(el.getAttribute('data-lib-open')));
    on('[data-file]', 'dblclick', el => openFile(el.getAttribute('data-file')));
    on('[data-lib-rename-file]', 'click', el => { L.renameFile = el.getAttribute('data-lib-rename-file'); render(); const i = root.querySelector('#lib-file-rename'); if (i) { i.focus(); i.select(); } });
    const renameFileOk = () => { const i = root.querySelector('#lib-file-rename'); const f = L.files.find(x => x.id === L.renameFile); if (i && f && i.value.trim()) { f.name = i.value.trim(); updateMeta(f).then(() => { L.renameFile = null; refreshLib(); }); } else { L.renameFile = null; render(); } };
    on('[data-lib-rename-file-ok]', 'click', renameFileOk);
    const fi = root.querySelector('#lib-file-rename'); if (fi) fi.addEventListener('keydown', e => { if (e.key === 'Enter') renameFileOk(); if (e.key === 'Escape') { L.renameFile = null; render(); } });
    on('[data-lib-del-file]', 'click', el => { const f = L.files.find(x => x.id === el.getAttribute('data-lib-del-file')); if (!f || !confirm('Supprimer « ' + f.name + ' » ?')) return; deleteFile(f.id).then(refreshLib); });
    const moveFile = (fileId, target) => { const f = L.files.find(x => x.id === fileId); if (!f) return; const dest = target === 'root' ? null : target; if (dest === f.folderId) return; f.folderId = dest; updateMeta(f).then(() => { refreshLib(); toast('Déplacé'); }); };
    on('[data-file-move]', 'change', el => { if (el.value) moveFile(el.getAttribute('data-file-move'), el.value); });
    on('[data-file-subject]', 'change', el => { const f = L.files.find(x => x.id === el.getAttribute('data-file-subject')); if (!f) return; f.subjectId = el.value; updateMeta(f).then(refreshLib); });

    on('[data-file]', 'dragstart', (el, e) => { e.dataTransfer.setData('text/carnet-file', el.getAttribute('data-file')); e.dataTransfer.effectAllowed = 'move'; el.classList.add('dragging'); });
    on('[data-file]', 'dragend', el => el.classList.remove('dragging'));
    on('[data-drop-folder]', 'dragover', (el, e) => { if (e.dataTransfer.types.includes('text/carnet-file') || e.dataTransfer.types.includes('Files')) { e.preventDefault(); e.stopPropagation(); el.classList.add('drop'); } });
    on('[data-drop-folder]', 'dragleave', el => el.classList.remove('drop'));
    on('[data-drop-folder]', 'drop', (el, e) => {
      e.preventDefault(); e.stopPropagation(); el.classList.remove('drop');
      const target = el.getAttribute('data-drop-folder');
      const fileId = e.dataTransfer.getData('text/carnet-file');
      if (fileId) moveFile(fileId, target); else if (e.dataTransfer.files.length) importFiles(e.dataTransfer.files, target === 'root' ? null : target);
    });
    const bindDropzone = (id, handler) => {
      const dz = root.querySelector(id); if (!dz) return;
      dz.addEventListener('dragover', e => { if (e.dataTransfer.types.includes('Files')) { e.preventDefault(); dz.classList.add('over'); } });
      dz.addEventListener('dragleave', e => { if (!dz.contains(e.relatedTarget)) dz.classList.remove('over'); });
      dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('over'); if (e.dataTransfer.files.length) handler(e.dataTransfer.files); });
    };
    bindDropzone('#lib-dropzone', files => importFiles(files, L.folderId));

    /* papers */
    const P = state.papers;
    const importPapers = fileList => {
      const ok = Array.from(fileList).filter(f => /\.(pdf|png|jpe?g|webp|gif)$/i.test(f.name) || /^(application\/pdf|image\/)/.test(f.type));
      if (!ok.length) { toast('PDF ou image attendu'); return; }
      const cat = P.cat === 'all' ? 'Administratif' : P.cat;
      Promise.all(ok.map(f => addFile(f, { kind: 'paper', category: cat, expiry: '', note: '' }))).then(() => { refreshLib(); toast(ok.length + ' papier' + (ok.length > 1 ? 's' : '') + ' ajouté' + (ok.length > 1 ? 's' : '')); }).catch(() => toast('Import impossible : stockage plein ou navigateur restreint'));
    };
    const pImport = root.querySelector('#paper-import'); if (pImport) pImport.addEventListener('change', () => importPapers(pImport.files));
    bindDropzone('#paper-dropzone', importPapers);
    bindSearch('#paper-search', P);
    on('[data-paper-cat]', 'click', el => { P.cat = el.getAttribute('data-paper-cat'); render(); });
    on('[data-paper-new-note]', 'click', () => { P.newNote = true; render(); const i = root.querySelector('#paper-note-name'); if (i) i.focus(); });
    on('[data-paper-cancel-note]', 'click', () => { P.newNote = false; render(); });
    const createNote = () => {
      const name = root.querySelector('#paper-note-name').value.trim(); if (!name) return;
      const cat = root.querySelector('#paper-note-cat').value;
      updateMeta({ id: uid(), kind: 'paper', noFile: true, name, category: cat, expiry: '', note: '', size: 0, addedAt: todayStr(), mime: '' }).then(() => { P.newNote = false; refreshLib(); });
    };
    on('[data-paper-create-note]', 'click', createNote);
    const pn = root.querySelector('#paper-note-name'); if (pn) pn.addEventListener('keydown', e => { if (e.key === 'Enter') createNote(); if (e.key === 'Escape') { P.newNote = false; render(); } });
    const paper = id => P.files.find(p => p.id === id);
    on('[data-paper-open]', 'click', el => openFile(el.getAttribute('data-paper-open')));
    on('[data-paper-setcat]', 'change', el => { const p = paper(el.getAttribute('data-paper-setcat')); if (p) { p.category = el.value; updateMeta(p).then(refreshLib); } });
    on('[data-paper-expiry]', 'change', el => { const p = paper(el.getAttribute('data-paper-expiry')); if (p) { p.expiry = el.value; updateMeta(p).then(refreshLib); } });
    let noteTimer = null;
    on('[data-paper-note]', 'input', el => { const p = paper(el.getAttribute('data-paper-note')); if (!p) return; p.note = el.value; autoGrow(el); clearTimeout(noteTimer); noteTimer = setTimeout(() => updateMeta(p), 400); });
    root.querySelectorAll('[data-paper-note]').forEach(autoGrow);
    on('[data-paper-rename]', 'click', el => { P.renameFile = el.getAttribute('data-paper-rename'); render(); const i = root.querySelector('#paper-rename'); if (i) { i.focus(); i.select(); } });
    const renamePaperOk = () => { const i = root.querySelector('#paper-rename'); const p = paper(P.renameFile); if (i && p && i.value.trim()) { p.name = i.value.trim(); updateMeta(p).then(() => { P.renameFile = null; refreshLib(); }); } else { P.renameFile = null; render(); } };
    on('[data-paper-rename-ok]', 'click', renamePaperOk);
    const pr = root.querySelector('#paper-rename'); if (pr) pr.addEventListener('keydown', e => { if (e.key === 'Enter') renamePaperOk(); if (e.key === 'Escape') { P.renameFile = null; render(); } });
    on('[data-paper-del]', 'click', el => { const p = paper(el.getAttribute('data-paper-del')); if (!p || !confirm('Supprimer « ' + p.name + ' » ?')) return; deleteFile(p.id).then(refreshLib); });

  }

  function autoGrow(el) { el.style.height = 'auto'; el.style.height = Math.max(36, el.scrollHeight) + 'px'; }
  function scrollToForm() { const f = root.querySelector('.block-form'); if (f) f.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); const l = root.querySelector('#bf-label'); if (l && !l.value) l.focus(); }

  function init() {
    state.settings = loadSettings();
    state.subjects = migrate(loadJSON(STORE_KEY, null) || defaultSubjects());
    state.checklist = loadJSON(CHECKLIST_PREFIX + state.dateStr, []);
    state.exams = loadExams();
    state.syncConfig = loadSyncConfig();
    if (state.syncConfig) {
      initFirebase(state.syncConfig).then(() => {
        fbAuth.onAuthStateChanged(user => onSyncAuthChange(user));
      }).catch(err => { state.syncStatus = 'error'; state.syncError = fbErrorMessage(err); render(); });
    }
    state.lib.folders = libFolders(); state.lib.folderId = null; state.lib.files = []; state.papers.files = [];
    state.resetConfirmOpen = false;
    purgeOldTrash();
    render();
    reloadFiles().then(() => { if (['library', 'settings', 'papers'].includes(state.activeTab)) render(); });
    maybeDailySnapshot();
    fsCheckStatus().then(st => { state.fsStatus = st; if (state.activeTab === 'settings') render(); });
    if (state.activeTab === 'settings') listBackups().then(list => { state.backups = list; render(); });
  }

  init();
})();
</script>
</body>
</html>
